<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    .box{fill:#ffffff;stroke:#0f172a;stroke-width:2;rx:8}
    .title{font: bold 14px sans-serif; fill:#0f172a}
    .desc{font: 12px sans-serif; fill:#0f172a}
    .arrow{stroke:#0f172a;stroke-width:2;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect class="box" x="40" y="40" width="300" height="120"/>
  <text class="title" x="60" y="68">Frontend</text>
  <text class="desc" x="60" y="92">React + Vite (UI components under src/components)</text>
  <text class="desc" x="60" y="110">Routing: @tanstack/react-router</text>

  <rect class="box" x="40" y="200" width="300" height="100"/>
  <text class="title" x="60" y="228">Local Persistence</text>
  <text class="desc" x="60" y="252">IndexedDB via mock backend (src/lib/mockBackend.ts)</text>
  <text class="desc" x="60" y="270">Fallback: localStorage seed</text>

  <rect class="box" x="520" y="120" width="300" height="140"/>
  <text class="title" x="540" y="148">Optional Backend</text>
  <text class="desc" x="540" y="172">Node.js + Express / Fastify</text>
  <text class="desc" x="540" y="190">Database: SQL (Postgres/MySQL) or NoSQL</text>

  <line class="arrow" x1="340" y1="100" x2="520" y2="160" />
  <text class="desc" x="360" y="120">API / Sync</text>

  <line class="arrow" x1="200" y1="160" x2="200" y2="200" />
  <text class="desc" x="220" y="180">persistence</text>

</svg>
